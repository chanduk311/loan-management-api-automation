name: API Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select test environment'
        required: true
        type: choice
        options:
          - TEST
          - ACCP

jobs:
  api-tests:

    runs-on: ubuntu-latest

    env:
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set API environment
        shell: bash
        run: |
            if [ "${{ inputs.environment }}" = "ACCP" ]; then
              echo "BASE_URL=${{ vars.ACCP_BASE_URL }}" >> "$GITHUB_ENV"
            else
              echo "BASE_URL=${{ vars.TEST_BASE_URL }}" >> "$GITHUB_ENV"
            fi
          
      - name: Configure API token
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: echo "API token configured"

      - name: Verify selected environment
        run: |
          echo "Selected environment: ${{ inputs.environment }}"
          echo "BASE_URL: $BASE_URL"

      - name: Run API automation tests
        run: mvn clean test

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
              name: extent-report
              path: test-reports/ExtentReport.html



