name: API Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select test environment'
        required: true
        type: choice
        options:
          - TEST
          - ACCP

      test_suite:
        description: 'Select test suite'
        required: true
        type: choice
        options:
          - SMOKE
          - REGRESSION

  schedule:
    - cron: '30 18 * * *'

jobs:
  api-tests:

    runs-on: ubuntu-latest

    env:
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set API environment
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run - using TEST environment"
            echo "BASE_URL=${{ vars.TEST_BASE_URL }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.environment }}" = "ACCP" ]; then
            echo "Manual run - using ACCP environment"
            echo "BASE_URL=${{ vars.ACCP_BASE_URL }}" >> "$GITHUB_ENV"
          else
            echo "Manual run - using TEST environment"
            echo "BASE_URL=${{ vars.TEST_BASE_URL }}" >> "$GITHUB_ENV"
            fi
          
      - name: Configure API token
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: echo "API token configured"

      - name: Verify selected configuration
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Test suite: ${{ inputs.test_suite }}"
          echo "BASE_URL: $BASE_URL"

      - name: Run API automation tests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TEST_SUITE="regression"
            echo "Scheduled run - executing REGRESSION suite"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TEST_SUITE="smoke"
            echo "Pull request - executing SMOKE suite"
          else
            TEST_SUITE=$(echo "${{ inputs.test_suite }}" | tr '[:upper:]' '[:lower:]')
            echo "Manual run - executing $TEST_SUITE suite"
          fi

          mvn clean test -Dgroups="$TEST_SUITE"

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
              name: extent-report
              path: test-reports/ExtentReport.html



